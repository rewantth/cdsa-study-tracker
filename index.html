<meta name="description" content="A section-by-section study tracker for the HTB SOC Analyst path and the CDSA exam. Works offline; progress is saved in your browser.">
<style>
:root{
  /* HTB CDSA theme: dark is the default. Colours and style only, no logos or artwork. */
  --bg:#0B0F19; --surface:#111927; --surface2:#172133; --line:#1F2B40; --line2:#31405A;
  --fg:#E8EEF8; --muted:#A3B0C5; --faint:#7F8FA9;
  --accent:#9FEF00; --accent-fg:#0B1300; --accent-soft:#16260A; --accent-t:#9FEF00;
  --cyan:#5CB2FF; --cyan-soft:#0F2740;
  --amber:#FFAF00; --amber-soft:#33260A;
  --bad:#FF3E3E; --bad-soft:#3A1416;
  --ring-track:#1B2639; --shadow:0 0 0 1px rgba(159,239,0,.02);
  --f-head:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --h1:#112033; --h2:#0D1624; --grid:rgba(159,239,0,.10); --scan:rgba(159,239,0,.05);
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#F1F4F9; --surface:#FFFFFF; --surface2:#F5F7FB; --line:#DFE5EE; --line2:#C3CDDB;
    --fg:#0B1220; --muted:#4A5870; --faint:#5F6E87;
    --accent:#2F7D00; --accent-fg:#FFFFFF; --accent-soft:#E4F5CD; --accent-t:#286B00;
    --cyan:#0A6FA3; --cyan-soft:#DDF0FB;
    --amber:#8A5300; --amber-soft:#FFF0D1;
    --bad:#B3261E; --bad-soft:#FBE4E1;
    --ring-track:#E3E9F1; --shadow:0 1px 2px rgba(11,18,32,.05),0 6px 20px rgba(11,18,32,.05);
    --h1:#EAF8D7; --h2:#F6FBEE; --grid:rgba(47,125,0,.14); --scan:rgba(47,125,0,.06);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F1F4F9; --surface:#FFFFFF; --surface2:#F5F7FB; --line:#DFE5EE; --line2:#C3CDDB;
  --fg:#0B1220; --muted:#4A5870; --faint:#5F6E87;
  --accent:#2F7D00; --accent-fg:#FFFFFF; --accent-soft:#E4F5CD; --accent-t:#286B00;
  --cyan:#0A6FA3; --cyan-soft:#DDF0FB;
  --amber:#8A5300; --amber-soft:#FFF0D1;
  --bad:#B3261E; --bad-soft:#FBE4E1;
  --ring-track:#E3E9F1; --shadow:0 1px 2px rgba(11,18,32,.05),0 6px 20px rgba(11,18,32,.05);
  --h1:#EAF8D7; --h2:#F6FBEE; --grid:rgba(47,125,0,.14); --scan:rgba(47,125,0,.06);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-t)}
h1,h2,h3,h4{font-family:var(--f-head);margin:0;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent-t);outline-offset:2px;border-radius:6px}

/* shell */
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}
.side{display:none}
.main{min-width:0;padding:20px max(16px,env(safe-area-inset-left,0px)) 108px max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:20px;width:100%}
.wrap .wrap{margin:0;max-width:none}
@media (min-width:960px){
  .app{grid-template-columns:248px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;padding:22px 16px;border-right:1px solid var(--line);background:var(--surface)}
  .main{padding:32px 36px 60px}
  .bottom{display:none!important}
}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font:700 13px var(--f-mono);letter-spacing:-.02em}
.brand b{display:block;font:700 15px var(--f-head);line-height:1.1}
.brand small{color:var(--muted);font-size:12px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:600;text-align:left}
.nav button:hover{background:var(--surface2);color:var(--fg)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-t)}
.nav svg,.bottom svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.mini{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px}
.mini .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
.mini .row b{color:var(--fg);font-family:var(--f-mono)}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px))}
.bottom button{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:600;padding:6px 0;border-radius:10px}
.bottom button[aria-current="page"]{color:var(--accent-t)}
.bottom button[aria-current="page"] svg{stroke-width:2.2}

/* generic */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top h1{font-size:26px;line-height:1.15;margin-top:6px}
.top p{color:var(--muted);margin-top:4px;max-width:60ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px}
.card h3{font-size:15px;margin-bottom:12px}
.eyebrow{font:600 11px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:var(--surface);color:var(--fg);padding:9px 14px;border-radius:10px;font-weight:600;font-size:14px;line-height:1.2;min-height:40px}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.sm{padding:6px 10px;min-height:32px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface2);color:var(--fg)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip{display:inline-flex;align-items:center;gap:5px;font:600 11px var(--f-mono);padding:3px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--accent-t);border-color:transparent}
.chip.cy{background:var(--cyan-soft);color:var(--cyan);border-color:transparent}
.chip.am{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.bar{height:7px;border-radius:99px;background:var(--ring-track);overflow:hidden}
.bar i{display:block;position:relative;overflow:hidden;height:100%;border-radius:99px;background:var(--accent);transition:width .35s ease}
.bar.cy i{background:var(--cyan)}
input[type=text],input[type=date],input[type=number],input[type=search],textarea,select{width:100%;background:var(--surface2);border:1px solid var(--line2);border-radius:10px;padding:9px 12px;min-height:40px}
textarea{resize:vertical;min-height:84px;line-height:1.5}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent-t);outline-offset:0;border-color:transparent}
label.f{display:flex;flex-direction:column;gap:6px;font:600 12.5px var(--f-mono);color:var(--muted)}
.grid2{display:grid;gap:14px;grid-template-columns:minmax(0,1fr);align-items:start}
.grid2>*,.card,.hero>*,.tiles>*,.wrap>*{min-width:0}
a.btn{text-decoration:none}
a.btn.primary{color:var(--accent-fg)}
@media (min-width:760px){.grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:760px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font:700 26px/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font:500 12px var(--f-mono);letter-spacing:.02em}
.tile small{color:var(--faint);font-size:12px}
.good{color:var(--accent-t)} .warnt{color:var(--amber)} .badt{color:var(--bad)}

/* checkbox */
.cb{appearance:none;-webkit-appearance:none;width:22px;height:22px;flex:none;margin:0;border-radius:7px;border:2px solid var(--line2);background:var(--surface);display:inline-grid;place-items:center;cursor:pointer;transition:background .12s,border-color .12s}
.cb:hover{border-color:var(--accent-t)}
.cb:checked{background:var(--accent-soft);border-color:var(--accent)}
.cb:checked::after{content:"";width:6px;height:11px;border:solid var(--accent-t);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}

/* dashboard */
.hero{position:relative;isolation:isolate;overflow:hidden;display:grid;gap:18px;grid-template-columns:minmax(0,1fr);background:linear-gradient(135deg,var(--h1),var(--h2));border:1px solid var(--line);border-radius:20px;padding:22px}
/* grid + scanline texture: hero only, masked away from the text column */
.hero::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/28px 28px,repeating-linear-gradient(0deg,var(--scan) 0 1px,transparent 1px 4px);-webkit-mask-image:linear-gradient(to top,#000 0,transparent 42%);mask-image:linear-gradient(to top,#000 0,transparent 42%)}
@media (min-width:760px){.hero::before{-webkit-mask-image:linear-gradient(to left,#000 0,transparent 46%);mask-image:linear-gradient(to left,#000 0,transparent 46%)}}
@media (min-width:760px){.hero{grid-template-columns:minmax(0,1fr) auto;align-items:center;padding:26px 30px}}
.hero h2{font-size:22px;line-height:1.25;margin:6px 0 4px}
.hero .hint{color:var(--muted);margin-bottom:16px;max-width:56ch}
.hero .acts{display:flex;gap:10px;flex-wrap:wrap}
.ringbox{position:relative;width:148px;height:148px;justify-self:center}
.ringbox svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringbox .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ringbox .c b{font:700 30px/1 var(--f-head)}
.ringbox .c span{font-size:12px;color:var(--muted)}
.stagebar{display:flex;flex-direction:column;gap:14px}
.sb{display:flex;flex-direction:column;gap:7px}
.sb .l{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.sb .l b{font-size:14px}
.sb .l span{font:500 12px var(--f-mono);color:var(--muted)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--ring-track);min-width:0}
.heat i.l1{background:color-mix(in srgb,var(--accent) 32%,var(--ring-track))}
.heat i.l2{background:color-mix(in srgb,var(--accent) 58%,var(--ring-track))}
.heat i.l3{background:color-mix(in srgb,var(--accent) 82%,var(--ring-track))}
.heat i.l4{background:var(--accent)}
.heat i.today{outline:2px solid var(--fg);outline-offset:-2px}
.heatwrap{overflow-x:auto;padding-bottom:2px}
.heatwrap .heat{min-width:420px}
.legend{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--faint);margin-top:8px;justify-content:flex-end}
.legend i{width:11px;height:11px;border-radius:3px;background:var(--ring-track)}
.upnext{display:flex;flex-direction:column;gap:2px}
.up{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.up:first-child{border-top:0}
.up:hover{background:var(--surface2)}
.up .n{flex:1;min-width:0}
.up .n b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up .n small{color:var(--muted);font-size:12px}

/* path */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tools .search{flex:1 1 220px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line2);background:var(--surface);color:var(--muted);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600}
.pill[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.stage{display:flex;flex-direction:column;gap:12px}
.stage-h{display:flex;align-items:center;gap:12px;padding:6px 2px}
.stage-h .no{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font:700 15px var(--f-mono);background:var(--cyan-soft);color:var(--cyan);flex:none}
.stage-h.s1 .no{background:var(--accent-soft);color:var(--accent-t)}
.stage-h h2{font-size:19px}
.stage-h p{color:var(--muted);font-size:13px}
.stage-h .r{margin-left:auto;font:600 13px var(--f-mono);color:var(--muted);white-space:nowrap}
.phase{font:600 11px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:10px 2px 0}
.mod{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.mod.done{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.mod.skipped{opacity:.6}
.mh{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;padding:14px 16px;text-align:left}
.mh:hover{background:var(--surface2)}
.idx{width:34px;height:34px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;font:700 12px var(--f-mono);color:var(--muted);flex:none}
.mod.done .idx{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.mh .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.mh .t b{font:600 15px/1.3 var(--f-head)}
.mh .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mh .pr{display:flex;flex-direction:column;align-items:flex-end;gap:6px;width:92px;flex:none}
.mh .pr span{font:600 12px var(--f-mono);color:var(--muted)}
.mh .pr .bar{width:100%}
.chev{width:18px;height:18px;stroke:var(--faint);fill:none;stroke-width:2;flex:none;transition:transform .2s}
.mod.open .chev{transform:rotate(180deg)}
.mb{border-top:1px solid var(--line);padding:16px;display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media (min-width:860px){.mb{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);padding:18px 20px}}
.mb-top{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.secs{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sec{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-top:1px solid var(--line);background:var(--surface)}
.sec:first-child{border-top:0}
.sec:hover{background:var(--surface2)}
.sec .cb{margin-top:1px}
.sec .tx{flex:1;min-width:0;cursor:pointer}
.sec .tx b{display:block;font-weight:600;font-size:14px;line-height:1.35}
.sec .tx small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.sec .no{font:500 11px var(--f-mono);color:var(--faint);margin-right:6px}
.sec.done .tx b{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line2)}
.sec.done .tx small{color:var(--faint)}
.sec .d{font:500 10.5px var(--f-mono);color:var(--faint);white-space:nowrap;margin-top:3px}
.flag{border:0;background:transparent;color:var(--line2);padding:2px;border-radius:6px;margin-top:-1px}
.flag svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linejoin:round}
.flag:hover{color:var(--amber)}
.flag.on{color:var(--amber)} .flag.on svg{fill:currentColor}
.guide{display:flex;flex-direction:column;gap:16px;min-width:0}
.guide h4{font:600 11px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.guide ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:14px}
.guide li::marker{color:var(--accent-t)}
.guide p{font-size:14px}
.note-box{display:flex;flex-direction:column;gap:6px}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* lists */
.checks{display:flex;flex-direction:column}
.crow{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.crow:first-child{border-top:0}
.crow label{flex:1;min-width:0;display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.crow .tx small{display:block;color:var(--muted);font-size:12.5px}
.crow.done .tx>b{color:var(--muted);text-decoration:line-through}
.count{display:flex;align-items:center;gap:6px}
.count .btn{padding:0;width:32px;min-height:32px}
.count b{min-width:44px;text-align:center;font-family:var(--f-mono)}
.codebox{position:relative}
.codebox pre{margin:0;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:46px 14px 14px;overflow-x:auto;font:13px/1.55 var(--f-mono);white-space:pre-wrap;overflow-wrap:anywhere}
.codebox .btn{position:absolute;top:8px;right:8px}
.evs{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.evs{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.ev{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.ev b{font-size:14px}
.ev .mono{color:var(--accent-t);font-size:12.5px}
.ev small{color:var(--muted)}
.res{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.res:first-child{border-top:0}
.res:hover b{text-decoration:underline}
.res .n{flex:1;min-width:0}
.res .n small{display:block;color:var(--muted)}
.res .n em{font:500 11px var(--f-mono);color:var(--faint);font-style:normal}
.app-row{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.app-row:first-child{border-top:0}
.app-row .n{flex:1;min-width:160px}
.app-row .n small{display:block;color:var(--muted)}
.row2{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:640px){.row2{grid-template-columns:1fr 1fr auto}}

/* dialog + toast */
dialog{border:1px solid var(--line2);background:var(--surface);color:var(--fg);border-radius:20px;padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 32px);box-shadow:0 24px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(5,8,14,.6);backdrop-filter:blur(3px)}
.dlg{display:flex;flex-direction:column;max-height:inherit}
.dlg header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.dlg header h3{font-size:17px}
.dlg .body{padding:18px 20px;overflow:auto;display:flex;flex-direction:column;gap:18px}
.dlg h4{font:600 11px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days button{width:44px;height:40px;border-radius:10px;border:1px solid var(--line2);background:var(--surface2);font-weight:600;font-size:13px;color:var(--muted)}
.days button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface2);padding:8px 14px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.mlist{display:flex;flex-direction:column;max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.mlist label{display:flex;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);font-size:14px;cursor:pointer}
.mlist label:first-child{border-top:0}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--surface2);color:var(--fg);border:1px solid var(--accent);padding:10px 14px;border-radius:12px;display:flex;gap:14px;align-items:center;font-size:14px;font-weight:500;z-index:60;transition:all .2s;max-width:calc(100vw - 32px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
@media (min-width:960px){.toast{bottom:28px}}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:transparent;color:var(--accent-t);font-weight:700;text-decoration:underline;padding:0}
.note{font-size:13px;color:var(--muted)}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* day plan */
.weekgrp{display:flex;flex-direction:column;gap:10px}
.wkh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:14px 2px 2px;font-size:13px;color:var(--muted)}
.wkh b{font:600 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.day{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.day.done{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.dh{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;padding:12px 14px;text-align:left}
.dh:hover{background:var(--surface2)}
.dn{width:34px;height:34px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:12px;color:var(--muted);flex:none}
.day.done .dn{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.day.today .dn{border-color:var(--accent);color:var(--accent-t)}
.dh .t{flex:1;min-width:0;display:flex;flex-direction:column}
.dh .t b{font-size:14.5px}
.dh .t small{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dh .cnt{font-size:12px;font-weight:600;color:var(--muted)}
.day.open .chev{transform:rotate(180deg)}
.db{border-top:1px solid var(--line);padding:6px 14px 14px}
.dr{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.dr:first-child{border-top:0}
.dr label{flex:1;min-width:0;cursor:pointer}
.dr label b{display:block;font-weight:600;font-size:14px}
.dr label small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px;line-height:1.6}
.dr label small .chip{margin-right:4px}
.dr.done label b{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line2)}
.dfoot{display:flex;flex-direction:column;gap:10px;align-items:flex-start;margin-top:10px}
.dfoot textarea{min-height:64px}
.bottom{grid-template-columns:repeat(5,1fr)}
.bottom button{font-size:10.5px}

.side .clock{margin:-8px 6px 0;font-size:12px;color:var(--muted);padding:8px 10px;background:var(--surface2);border:1px solid var(--line);border-radius:10px}
.mtop .clock{display:block}

/* v4 additions */
.dlist{display:flex;flex-direction:column}
.dlist .dr:first-child{border-top:0}
.tm{font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.row-btn{display:flex;gap:8px;flex-wrap:wrap}
.rv{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.rvn{flex:1;min-width:0}
.rvn b{display:block;font-size:14px}
.rvn small{color:var(--muted);font-size:12.5px}
.rvn details{margin-top:6px;font-size:13px;color:var(--muted)}
.rvn summary{cursor:pointer;color:var(--accent-t);font-weight:600}
.rvb{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.bdg{font:600 12px var(--f-mono);padding:6px 10px;border-radius:999px;border:1px dashed var(--line2);color:var(--faint)}
.bdg.on{border-style:solid;border-color:transparent;background:var(--accent-soft);color:var(--accent-t)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end}
.wc{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.wc .wb{width:100%;max-width:34px;height:92px;display:flex;align-items:flex-end;background:var(--surface2);border-radius:8px;overflow:hidden}
.wc .wb i{display:block;width:100%;background:var(--accent);opacity:.55;border-radius:6px 6px 0 0}
.wc.td .wb i{opacity:1}
.wc .wn{font-size:12px;font-weight:700}
.wc .wd{font-size:11px;color:var(--muted)}
.wc .wm{font-size:10px;color:var(--faint);min-height:12px}
.res{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.res:first-child{border-top:0}
.res .n{flex:1;min-width:0;text-decoration:none;color:inherit}
.res .n b{display:block}
.res .n:hover b{text-decoration:underline}
.res .n small{display:block;color:var(--muted);font-size:12.5px}
.res .n em{font:500 11px var(--f-mono);color:var(--faint);font-style:normal}
.star{border:0;background:transparent;color:var(--line2);padding:4px;border-radius:8px;flex:none}
.star svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linejoin:round}
.star:hover{color:var(--amber)}
.star.on{color:var(--amber)}.star.on svg{fill:currentColor}
.day.missed{opacity:.85}
.day.missed .dn{border-style:dashed}

/* problems after module */
.probs{border:1px solid var(--line);border-radius:var(--r2,14px);padding:14px 16px;background:var(--card2,transparent);min-width:0}
.probs.ready{border-color:var(--accent-t);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent-t) 14%,transparent)}
.probs-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.probs-h h4{font:600 11px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--accent-t);margin:0}
.probs .note{margin:4px 0 6px;font-size:13px}
.prob .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.prob>.btn{flex:none;max-width:42%;white-space:normal;text-align:center}
.rmlist{display:flex;flex-direction:column;gap:8px}
.rm{border:1px solid var(--line);border-radius:12px;padding:0 14px;min-width:0}
.rm summary{display:flex;gap:10px;align-items:center;padding:12px 0;cursor:pointer;list-style:none}
.rm summary::-webkit-details-marker{display:none}
.rm summary b{flex:1;min-width:0}
.rm summary .idx{font:600 12px var(--f-mono);color:var(--accent-t);min-width:26px}
.rm[open] summary{border-bottom:1px solid var(--line)}
.tips{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.tips small{display:block;color:var(--muted);font-size:12px}
@media(max-width:560px){.prob{flex-wrap:wrap}.prob>label{flex:1 1 100%}.prob>.btn{max-width:none;margin-left:34px}}

.mtop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-4px 0 14px}
@media (min-width:960px){.mtop{display:none}}

/* rank + shield */
.rankcard{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface2)}
.shield{width:44px;height:52px;flex:none;display:block}
.shield .out{fill:var(--surface);stroke:var(--line2);stroke-width:2}
.shield .fill{fill:var(--accent)}
.shield .rim{fill:none;stroke:var(--accent);stroke-width:2}
.shield .chk{fill:none;stroke:var(--accent-fg);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.rk{min-width:0;display:flex;flex-direction:column;gap:2px}
.rk .nm{font:700 14px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--accent-t)}
.rk small{font:500 11.5px var(--f-mono);color:var(--muted);line-height:1.4}
.mrank{display:flex;align-items:center;gap:8px;min-width:0}
.mrank .shield{width:24px;height:28px}
.mrank .nm{font:700 11.5px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--accent-t);white-space:nowrap}
@media (max-width:430px){.mrank .nm{display:none}}
.top .chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* settings switches */
.swrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0;border-top:1px solid var(--line)}
.swrow:first-of-type{border-top:0;padding-top:0}
.swrow b{display:block;font-size:14px}
.swrow small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.swctl{display:flex;align-items:center;gap:8px;flex:none}
.swctl span{font:600 11px var(--f-mono);color:var(--muted);min-width:22px;text-align:right}
.switch{flex:none;width:46px;height:26px;border-radius:99px;border:2px solid var(--line2);background:var(--surface2);position:relative;padding:0;transition:background .15s,border-color .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--faint);transition:transform .15s,background .15s}
.switch[aria-checked="true"]{background:var(--accent-soft);border-color:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(20px);background:var(--accent)}

/* celebrations: everything here is decoration, never in the way of input */
.fx-cv{position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;z-index:65}
@keyframes cbpop{0%{transform:scale(1)}40%{transform:scale(1.32)}100%{transform:scale(1)}}
@keyframes cbring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 70%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
@keyframes cbdraw{0%{clip-path:inset(11px 8.5px 0 0)}40%{clip-path:inset(11px 0 0 0)}100%{clip-path:inset(0 0 0 0)}}
.cb.pop{animation:cbpop .38s cubic-bezier(.3,1.6,.5,1),cbring .6s ease-out}
.cb.pop:checked::after{animation:cbdraw .34s ease-out .04s both}
@keyframes rowglow{from{background-color:color-mix(in srgb,var(--accent) 24%,transparent);box-shadow:inset 3px 0 0 var(--accent)}}
.glow{animation:rowglow 1.1s ease-out}
@keyframes shine{from{transform:translateX(-120%)}to{transform:translateX(320%)}}
.bar i.shine::after{content:"";position:absolute;top:0;bottom:0;left:0;width:45%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent);animation:shine .9s ease-out .35s 2 both}
@keyframes modglow{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
.mod.just{animation:modglow 1s ease-out}
@keyframes ringpulse{0%{transform:scale(1)}35%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes ripple{0%{opacity:.75;transform:scale(.9)}100%{opacity:0;transform:scale(1.55)}}
.ringbox.pulse{animation:ringpulse .7s ease-out}
.ringbox.pulse::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--accent);animation:ripple .9s ease-out forwards;pointer-events:none}
.hero.done{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.hero.done .eyebrow{color:var(--accent-t)}
/* static stand-in used instead of motion when the system asks for reduced motion */
.hl{outline:2px solid var(--accent);outline-offset:-2px;background-color:var(--accent-soft)}
.mod.hl,.hero.hl{outline-offset:0}
.ringbox.hl{outline-offset:2px;border-radius:50%;background-color:transparent}
.cb.hl{outline-offset:2px}
.ach{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-16px);opacity:0;visibility:hidden;pointer-events:none;z-index:70;width:min(440px,calc(100vw - 24px));display:flex;gap:12px;align-items:flex-start;background:var(--surface);color:var(--fg);border:1px solid var(--accent);border-radius:16px;padding:14px 12px 14px 16px;box-shadow:0 16px 50px rgba(0,0,0,.45),0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent);transition:opacity .25s,transform .25s,visibility 0s .25s}
.ach.on{opacity:1;transform:translate(-50%,0);visibility:visible;pointer-events:auto;transition:opacity .25s,transform .25s,visibility 0s 0s}
.ach .ic{flex:none;width:34px;height:40px}
.ach .tx{flex:1;min-width:0}
.ach .eyebrow{color:var(--accent-t)}
.ach b{display:block;font:700 17px/1.25 var(--f-head);margin-top:2px}
.ach p{color:var(--muted);font-size:13.5px;margin-top:3px}
.ach p.also{font:500 12px var(--f-mono);color:var(--faint)}
.ach .x{flex:none;border:0;background:transparent;color:var(--muted);font:600 12px var(--f-mono);padding:4px 6px;border-radius:8px}
.ach .x:hover{background:var(--surface2);color:var(--fg)}
@media (prefers-reduced-motion:reduce){
  .cb.pop,.cb.pop:checked::after,.glow,.bar i.shine::after,.mod.just,.ringbox.pulse,.ringbox.pulse::after{animation:none!important}
  .ach{transform:translate(-50%,0)}
  .fx-cv{display:none!important}
}

</style>

<script>
/* ---------- content: Stage 0 (basics) ---------- */
/* sec strings are "Title | one-line focus". Titles and counts match HTB Academy's public syllabus. */
var STAGE0 = [
 {id:'net', name:'Introduction to Networking', diff:'Fundamental', tier:'Core', slug:'introduction-to-networking',
  why:'Every alert, log line and packet capture in the path assumes you already know ports, protocols and how a connection is built. If this is shaky, Network Traffic Analysis and the IDS module will feel twice as hard.',
  learn:['How the OSI and TCP/IP models map onto real traffic','IPv4 addressing and subnetting by hand','What DNS, DHCP, HTTP, SMB, RDP and Kerberos do and which ports they use','TCP vs UDP, and what a normal handshake looks like'],
  practice:['Subnet ten random networks on paper until it is quick','Run Wireshark on your own machine, load one website, and find the DNS query, the TCP handshake and the HTTP request','Write a one-page port cheat sheet (53 DNS, 88 Kerberos, 445 SMB, 3389 RDP, 5985/5986 WinRM, 389/636 LDAP)'],
  can:['Explain what happens between typing a URL and the page loading','Work out the range, mask and broadcast of a /26','Tell a SYN scan from a normal connection in a capture'],
  sec:['Networking Overview | What the module covers and how it is laid out.','Network Types | LAN, WAN, WLAN, VPN: where each one sits.','Networking Topologies | Star, mesh, bus. Know what a switch vs a router does.','Proxies | Forward vs reverse proxies; why logs show the proxy IP.','Networking Models | Why layered models exist.','The OSI Model | Learn all seven layers and one protocol for each.','The TCP/IP Model | The four-layer version you will actually use.','Network Layer | Routing, hops, TTL.','IPv4 Addresses | Classes, private ranges, CIDR notation.','Subnetting | Do the exercises by hand until fast.','MAC Addresses | Layer 2 identity; what ARP resolves.','IPv6 Addresses | Format, shortening rules, link-local.','Networking Key Terminology | Vocabulary you will see in every later module.','Common Protocols | HTTP, FTP, SMB, DNS, SMTP and friends, with ports.','Wireless Networks | WPA basics and why Wi-Fi attacks leave traces.','Virtual Private Networks | Tunnels, and what a VPN hides from your logs.','Vendor Specific Information | Cisco-style device terms.','Key Exchange Mechanisms | Diffie-Hellman idea; no maths needed.','Authentication Protocols | Kerberos, NTLM, RADIUS at overview level.','TCP/UDP Connections | Handshake, flags, teardown. Needed for traffic analysis.','Cryptography | Hashing vs encryption vs signing.']},

 {id:'winf', name:'Windows Fundamentals', diff:'Fundamental', tier:'Core', slug:'windows-fundamentals',
  why:'The exam and most of the path are Windows telemetry. You cannot spot a rogue service, a strange registry key or a bad process tree without knowing what normal looks like.',
  learn:['How the file system, NTFS permissions and shares work','Registry hives and the keys attackers use for persistence','Services, processes and sessions, and which ones are normal','WMI, MMC and the built-in security features'],
  practice:['In a Windows VM, open Task Manager and Services and write down what is normal on a clean install','Browse the Run and RunOnce keys and learn what a legitimate entry looks like','Open Event Viewer and find one logon event (4624) yourself'],
  can:['Describe the parent and child you expect for explorer.exe, svchost.exe and services.exe','Name three registry locations used for persistence','Explain the difference between NTFS and share permissions'],
  sec:['Introduction to Windows | Versions and why the OS matters to defenders.','Operating System Structure | System folders: what lives in System32.','File System | NTFS features, alternate data streams.','NTFS vs. Share Permissions | Effective access when both apply.','Windows Registry | Hives, Run keys, persistence spots.','Windows Services & Processes | Normal parents; services.exe and svchost.exe.','Service Permissions | Weak service permissions as an attack path.','Windows Sessions | Interactive, service and network logons.','Interacting with the Windows Operating System | GUI, CMD, PowerShell, remote access.','Windows Management Instrumentation (WMI) | Used by admins and attackers alike.','Microsoft Management Console (MMC) | Snap-ins you will meet again in AD.','Windows Subsystem for Linux (WSL) | A blind spot for some tooling.','Desktop Experience vs. Server Core | What a server install looks like.','Windows Security | Defender, UAC, Credential Guard at overview level.','Skills Assessment - Windows Fundamentals | Do it without looking back at the notes.']},

 {id:'wcl', name:'Introduction to Windows Command Line', diff:'Easy', tier:'Core', slug:'introduction-to-windows-command-line',
  why:'You will pull evidence with PowerShell (Get-WinEvent, Get-Process, services, registry) and read attacker one-liners all the time. Reading a command line fluently is half of triage.',
  learn:['CMD and PowerShell navigation, files, services and scheduled tasks','Cmdlets, modules, pipelines and filtering','Querying the registry and the event log from the command line','Basic PowerShell scripting'],
  practice:['Use Get-WinEvent with -FilterHashtable to pull all 4625 events from the last day','List running processes with their parent process ID, then explain two of them','Write a three-line script that exports services set to auto-start'],
  can:['Filter an event log by ID and time range from PowerShell','Explain what a base64 -EncodedCommand argument is','List scheduled tasks and services without the GUI'],
  sec:['Introduction | Why the command line matters in IR.','Command Prompt Basics | Syntax, flags, redirection.','Getting Help | help, /?, Get-Help. Use them constantly.','System Navigation | cd, dir, pushd.','Working with Directories and Files - CMD | Create, copy, move, hide.','Gathering System Information | systeminfo, ver, hostname, whoami.','Finding Files and Directories | where, dir /s, findstr.','Environment Variables | %PATH% and why order matters.','Managing Services | sc and net start.','Working With Scheduled Tasks | schtasks: a favourite persistence spot.','CMD Vs. PowerShell | Objects vs text.','All About Cmdlets and Modules | Verb-Noun and Get-Command.','User and Group Management | Local users, groups, who is admin.','Working with Files and Directories - PowerShell | Get-ChildItem and friends.','Finding & Filtering Content | Select-String, Where-Object.','Working with Services | Get-Service, Set-Service.','Working with the Registry | Reading and writing keys.','Working with the Windows Event Log | Get-WinEvent. Direct exam skill.','Networking Management from The CLI | netstat, Get-NetTCPConnection.','Interacting with The Web | Invoke-WebRequest: how downloaders work.','PowerShell Scripting and Automation | Loops, functions, simple scripts.','Skills Assessment | Time yourself.','Beyond This Module | Where to go next.']},

 {id:'ad', name:'Introduction to Active Directory', diff:'Fundamental', tier:'Core', slug:'introduction-to-active-directory',

/* The planner: spreads what is left between today and the target date.
   It is rebuilt on every render, so falling behind or getting ahead moves tomorrow's load by itself. */
function engine(){
  var t=todayD(),tk=ymd(t),start=S.start?parse(S.start):t;
  var pl=planList(),rem=[],dTodayList=[],doneCount=0;
  pl.forEach(function(x){var v=S.done[x.s.id];if(v){doneCount++;if(v===tk)dTodayList.push(x);}else rem.push(x);});
  var deadline=S.exam?addDays(parse(S.exam),-7):addDays(start,Math.max(7,S.target)-1);
  var first=t>start?t:start,slots=[],d=first,g=0;
  while(d<=deadline&&g<1500){if(isStudy(d))slots.push(d);d=addDays(d,1);g++;}
  var overdue=false;
  if(rem.length&&!slots.length&&t>=start){
    // past the target date: keep going at a fixed pace from today
    overdue=true;d=t;g=0;var need=Math.ceil(rem.length/EXT_PER)+1;
    while(slots.length<need&&g<4000){if(isStudy(d))slots.push(d);d=addDays(d,1);g++;}
  }
  var todayIsSlot=slots.length>0&&ymd(slots[0])===tk;
  var R0=rem.length+(todayIsSlot?dTodayList.length:0),quota=0;
  if(rem.length||dTodayList.length){quota=overdue?EXT_PER:(slots.length?Math.ceil(R0/slots.length):EXT_PER);}
  var todayItems=[],after=rem;
  if(todayIsSlot){var left=Math.max(0,quota-dTodayList.length);todayItems=rem.slice(0,left);after=rem.slice(left);}
  var fs=todayIsSlot?slots.slice(1):slots.slice();
  var days=[],modTarget={},secDate={};
  todayItems.forEach(function(x){modTarget[x.m.id]=t;secDate[x.s.id]=t;});
  if(after.length&&fs.length){
    var idx=0;
    if(overdue){fs.forEach(function(dt){if(idx<after.length){days.push({date:dt,items:after.slice(idx,idx+EXT_PER)});idx+=EXT_PER;}});}
    else{var base=Math.floor(after.length/fs.length),extra=after.length%fs.length;fs.forEach(function(dt,k){var n=base+(k<extra?1:0);if(n>0){days.push({date:dt,items:after.slice(idx,idx+n)});idx+=n;}});}
    days.forEach(function(dy){dy.items.forEach(function(x){modTarget[x.m.id]=dy.date;secDate[x.s.id]=dy.date;});});
  }
  var totalStudy=0,elapsed=0,dd2=start;g=0;
  while(dd2<=deadline&&g<1500){if(isStudy(dd2)){totalStudy++;if(dd2<t)elapsed++;}dd2=addDays(dd2,1);g++;}
  var ideal=totalStudy?Math.round(pl.length*elapsed/totalStudy):0;if(t<start)ideal=0;

}
function history(E){
  var c={};Object.keys(S.done).forEach(function(k){var v=S.done[k];if(isDate(v)&&v<E.tk){(c[v]=c[v]||[]).push({m:SEC[k].m,s:SEC[k]});}});
  var out=[],d=E.start,g=0;
  while(d<E.t&&g<1500){var k=ymd(d),items=c[k]||[];if(isStudy(d)||items.length)out.push({key:k,date:d,items:items,kind:'past',missed:items.length===0});d=addDays(d,1);g++;}

function pLoop(ts){
  var dt=tPrev?Math.min(.05,(ts-tPrev)/1000):.016;tPrev=ts;

  for(var i=PS.length-1;i>=0;i--){
    var p=PS[i];p.age+=dt;var u=p.age-p.delay;
    if(u<0)continue;
    if(u>=p.life||p.y>innerHeight+40){PS.splice(i,1);continue;}

    cg.save();cg.globalAlpha=u>p.life*.7?Math.max(0,1-(u-p.life*.7)/(p.life*.3)):1;cg.translate(p.x,p.y);cg.rotate(p.r);cg.fillStyle=p.c;

    case 'celeb':S.celeb=!S.celeb;save();openSettings(true);break;
    case 'sound':S.sound=!S.sound;save();openSettings(true);tick(false);break;
    case 'celebTest':previewFx();break;
    case 'achClose':$('#ach').classList.remove('on');clearTimeout(achT);break;
    case 'markDone':{var n=0;[].forEach.call(document.querySelectorAll('#prior input:checked'),function(c){BY[c.value].secs.forEach(function(s){if(!S.done[s.id]){S.done[s.id]='x';n++;}});});after({silent:true});render();openSettings(true);toast(n+' sections marked done');break;}
    case 'startToday':S.start=ymd(todayD());save();render();openSettings(true);break;
    case 'export':doExport();break;
    case 'copyBackup':copyText(JSON.stringify(S),'Backup');break;
    case 'doImport':try{var o=JSON.parse($('#impText').value);S=norm(o,false);if(!S.start)S.start=ymd(todayD());FX=null;pStop();awardBadges();sealCel();save();applyTheme();render();closeDlg();toast('Backup imported');}catch(err){toast('That is not a valid backup');}break;
    case 'reset':{var now=Date.now();if(now-lastResetTap<4000){S=def();S.start=ymd(todayD());FX=null;save();applyTheme();render();closeDlg();toast('All progress erased');lastResetTap=0;}else{lastResetTap=now;el.textContent='Click again to erase everything';setTimeout(function(){if(el.isConnected)el.textContent='Reset all progress';},4000);}break;}
    case 'shareCopy':copyText($('#shareText').value,'Post text');break;
    case 'shareDl':shareDownload();break;
  }
}
function doExport(){
  var txt=JSON.stringify(S,null,2);
  try{var b=new Blob([txt],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='cdsa-tracker-backup-'+ymd(todayD())+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},1000);toast('Backup downloaded');}catch(e){copyText(txt,'Backup');}
}

/* settings */
var dlg;
function openSettings(keep){
  var E=engine();
  var h='<div class="dlg"><header><h3>Settings</h3><button class="btn sm ghost" data-act="close">Close</button></header><div class="body">';
  h+='<div><h4>Plan</h4><div class="grid2" style="gap:12px"><label class="f">Finish in (days from start)<input type="number" id="sTarget" min="7" max="400" value="'+S.target+'"></label><label class="f">Exam date (optional)<input type="date" id="sExam" value="'+esc(S.exam)+'"></label></div>'
    +'<div style="margin-top:12px"><span class="note" style="display:block;margin-bottom:6px">Study days</span><div class="days">'+[[1,'Mon'],[2,'Tue'],[3,'Wed'],[4,'Thu'],[5,'Fri'],[6,'Sat'],[0,'Sun']].map(function(d){return '<button data-act="day" data-d="'+d[0]+'" aria-pressed="'+(S.days.indexOf(d[0])>=0)+'">'+d[1]+'</button>';}).join('')+'</div></div>'
    +'<p class="note" style="margin-top:10px">Started '+fmtL(E.start)+' (the day you first opened this page). The plan finishes by '+fmtL(E.deadline)+(S.exam?', a week before your exam':'')+'. It is rebuilt every day from what is left.</p>'
    +'<details style="margin-top:8px"><summary class="note" style="cursor:pointer">Advanced: change start date</summary><div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><input type="date" id="sStart" value="'+esc(S.start)+'" style="max-width:200px"><button class="btn sm" data-act="startToday">Use today</button></div></details></div>';
  h+='<div><h4>Theme</h4><div class="seg">'+['system','light','dark'].map(function(t){return '<button data-act="theme" data-v="'+t+'" aria-pressed="'+(S.theme===t)+'">'+t[0].toUpperCase()+t.slice(1)+'</button>';}).join('')+'</div></div>';
  h+='<div><h4>Celebrations</h4>'
    +'<div class="swrow"><div><b id="lbCel">Celebrations</b><small>Pops, confetti and milestone banners when you finish things.'+(reduced()?' Your device asks for reduced motion, so you get static highlights and no particles.':' Respects the reduced-motion setting on your device.')+'</small></div><div class="swctl"><span class="mono">'+(S.celeb?'On':'Off')+'</span><button class="switch" role="switch" aria-checked="'+S.celeb+'" aria-labelledby="lbCel" data-act="celeb"></button></div></div>'
    +'<div class="swrow"><div><b id="lbSnd">Sound</b><small>One soft tick, generated in the browser. Off by default.</small></div><div class="swctl"><span class="mono">'+(S.sound?'On':'Off')+'</span><button class="switch" role="switch" aria-checked="'+S.sound+'" aria-labelledby="lbSnd" data-act="sound"></button></div></div>'
    +'<div style="margin-top:6px"><button class="btn sm" data-act="celebTest">Preview a celebration</button></div></div>';
  h+='<div><h4>Already finished some modules?</h4><div class="mlist" id="prior">'+MODS.map(function(m){var x=modStat(m);return '<label><input class="cb" type="checkbox" value="'+m.id+'"'+(x.done===x.total?' checked disabled':'')+'><span>'+esc(m.name)+'</span></label>';}).join('')+'</div><div style="margin-top:10px"><button class="btn sm" data-act="markDone">Mark selected as done</button></div></div>';
  h+='<div><h4>Backup</h4><p class="note" style="margin-bottom:10px">Progress is saved in this browser only. Export a backup now and then, and before clearing site data.'+(memOnly?' <b class="warnt">Browser storage is unavailable right now, so progress will not persist.</b>':'')+'</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" data-act="export">Download backup</button><button class="btn sm" data-act="copyBackup">Copy backup</button></div><label class="f" style="margin-top:12px">Restore: paste a backup, or choose a file<textarea id="impText" placeholder="Paste backup JSON here"></textarea></label><div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center"><button class="btn sm" data-act="doImport">Restore from text</button><input type="file" id="impFile" accept="application/json,.json" style="max-width:230px"></div></div>';
  h+='<div><button class="btn sm danger" data-act="reset">Reset all progress</button></div></div></div>';
  dlg.innerHTML=h;
  if(!keep){if(dlg.showModal)dlg.showModal();else dlg.setAttribute('open','');}
}
function closeDlg(){if(dlg.close)dlg.close();else dlg.removeAttribute('open');}

/* share */
function shareStats(){
  var E=engine(),c=doneDates(),s1=stageStat(1),s0=stageStat(0),all=E.total?E.done/E.total:0;
  return {E:E,all:all,s0:s0,s1:s1,streak:streakNow(c),hours:totalFocus()/60,day:E.notStarted?0:E.dayNo};
}
function shareText(){
  var x=shareStats();
  return 'Day '+x.day+' of working through the HTB SOC Analyst path for the CDSA: '+x.E.done+' of '+x.E.total+' sections done ('+pct(x.all)+'%), '+x.streak+'-day streak, '+Math.round(x.hours*10)/10+' focused hours. Studying one section at a time. #CDSA #BlueTeam #HackTheBox';
}
function drawShare(cv){
  var x=shareStats(),W=1200,H=630,g=cv.getContext('2d');cv.width=W;cv.height=H;
  var dark=document.documentElement.getAttribute('data-theme')==='dark'||(!document.documentElement.getAttribute('data-theme')&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
  var bg=dark?'#0B0F19':'#F1F4F9',card=dark?'#111927':'#FFFFFF',fg=dark?'#E8EEF8':'#0B1220',mu=dark?'#A3B0C5':'#4A5870',ac=dark?'#9FEF00':'#2F7D00',tr=dark?'#1B2639':'#E3E9F1';
  g.fillStyle=bg;g.fillRect(0,0,W,H);
  g.fillStyle=card;rr(g,40,40,W-80,H-80,28);g.fill();
  g.fillStyle=mu;g.font='600 24px ui-monospace,Menlo,Consolas,monospace';g.fillText('HTB SOC ANALYST PATH  ·  CDSA  ·  '+rankInfo().name.toUpperCase(),90,110);
  g.fillStyle=fg;g.font='700 64px system-ui,Segoe UI,Arial,sans-serif';g.fillText('Day '+x.day+' of my CDSA study plan',90,200);
  // ring
  var cx=300,cy=400,r=120;g.lineWidth=26;g.lineCap='round';g.strokeStyle=tr;g.beginPath();g.arc(cx,cy,r,0,Math.PI*2);g.stroke();
  g.strokeStyle=ac;g.beginPath();g.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+Math.PI*2*x.all);g.stroke();
  g.fillStyle=fg;g.textAlign='center';g.font='700 64px system-ui,Segoe UI,Arial,sans-serif';g.fillText(pct(x.all)+'%',cx,cy+20);g.fillStyle=mu;g.font='500 22px system-ui,Segoe UI,Arial,sans-serif';g.fillText(x.E.done+' / '+x.E.total+' sections',cx,cy+56);g.textAlign='left';
  var stats=[[x.streak+(x.streak===1?' day':' days'),'streak'],[(Math.round(x.hours*10)/10)+' h','focused time'],[x.s1.done+' / '+x.s1.total,'SOC Analyst path'],[x.s0.done+' / '+x.s0.total,'basics']];
  stats.forEach(function(s,i){var px=560+(i%2)*300,py=330+Math.floor(i/2)*130;g.fillStyle=fg;g.font='700 44px system-ui,Segoe UI,Arial,sans-serif';g.fillText(s[0],px,py);g.fillStyle=mu;g.font='500 22px system-ui,Segoe UI,Arial,sans-serif';g.fillText(s[1],px,py+34);});
}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function openShare(){
  dlg.innerHTML='<div class="dlg"><header><h3>Share your progress</h3><button class="btn sm ghost" data-act="close">Close</button></header><div class="body"><canvas id="shareCv" style="width:100%;height:auto;border-radius:12px;border:1px solid var(--line)"></canvas><label class="f">Post text<textarea id="shareText"></textarea></label><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary sm" data-act="shareCopy">Copy post text</button><button class="btn sm" data-act="shareDl">Download image</button></div><p class="note">Paste it into LinkedIn, Reddit or Discord. Nothing is uploaded anywhere.</p></div></div>';
  if(dlg.showModal)dlg.showModal();else dlg.setAttribute('open','');
  drawShare($('#shareCv'));$('#shareText').value=shareText();
}
function shareDownload(){
  try{$('#shareCv').toBlob(function(b){var u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='cdsa-progress.png';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},1000);toast('Image downloaded');});}catch(e){toast('Right-click the image to save it');}
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act;
  if(a==='sec'||a==='lab'||a==='gate'||a==='note'||a==='dnote')return;
  onAction(el);
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.id==='sStart'&&el.value){S.start=el.value;save();render();openSettings(true);return;}
  if(el.id==='sTarget'){var v=Math.round(+el.value);if(v>=7){S.target=Math.min(400,v);S.exam='';save();render();openSettings(true);}return;}
  if(el.id==='sExam'||el.id==='xDate'){S.exam=el.value||'';save();render();if(el.id==='sExam')openSettings(true);return;}
  if(el.id==='impFile'&&el.files&&el.files[0]){var r=new FileReader();r.onload=function(){$('#impText').value=String(r.result);toast('File loaded. Press Restore.');};r.readAsText(el.files[0]);return;}
  var a=el.dataset&&el.dataset.act,id=el.dataset&&el.dataset.id;
  if(a==='sec'){var snap=takeSnap();setSec(id,el.checked);after({snap:snap,tick:{id:id,on:el.checked,kind:'sec'}});var sc=window.scrollY;if(tab==='path'){renderList();chrome();playFx();}else render();window.scrollTo(0,sc);var again=document.getElementById(el.id);if(again)try{again.focus({preventScroll:true});}catch(x){}}
  else if(a==='lab'){if(el.checked)S.labs[id]=1;else delete S.labs[id];after({tick:{id:id,on:el.checked,kind:id.indexOf('p.')===0?'prob':'lab'}});render();}
  else if(a==='gate'){if(el.checked)S.gate[id]=1;else delete S.gate[id];after();render();}
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.id==='q'){F.q=el.value;renderList();return;}
  if(el.id==='rq'){F.rq=el.value;$('#rlist').innerHTML=resList();return;}
  if(!el.dataset)return;
  if(el.dataset.act==='dnote'){S.dnotes[el.dataset.id]=el.value;if(!el.value)delete S.dnotes[el.dataset.id];save();return;}
  if(el.dataset.act==='note'){S.notes[el.dataset.id]=el.value;if(!el.value)delete S.notes[el.dataset.id];save();}
});
window.addEventListener('hashchange',function(){var h=(location.hash||'').replace('#','');if(h==='dash')h='today';if(TABS.indexOf(h)>=0&&h!==tab){tab=h;render();if(h==='plan')setTimeout(scrollToday,0);}});

/* ---------- clock and day rollover ---------- */
function tickClock(){
  var n=new Date(),txt=n.toLocaleString(undefined,{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
  [].forEach.call(document.querySelectorAll('.clock'),function(c){c.textContent=txt;});
  var k=ymd(todayD());
  if(k!==lastDay){lastDay=k;render();toast('New day: '+fmtL(todayD()));}
  if(S.timer&&S.timer.end<=Date.now())finishTimer(true,true);
}
setInterval(tickClock,15000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)tickClock();});
window.addEventListener('focus',tickClock);

/* ---------- boot ---------- */
dlg=$('#dlg');
dlg.addEventListener('click',function(e){if(e.target===dlg)closeDlg();});
if(!S.start){S.start=ymd(todayD());persist();}
applyTheme();
awardBadges();
sealCel();
render();
tickClock();
startTick();
if(tab==='plan')setTimeout(scrollToday,0);
})();

</script>
</body>
</html>
